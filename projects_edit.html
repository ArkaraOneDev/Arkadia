function renderKomoditasDropdown(currentValue = '') {
    const select = document.getElementById("komoditas");
    const selectedSector = document.getElementById("sektor").value;
    const addCommodityButton = document.querySelector("#komoditas-group button");
    
    select.innerHTML = '<option value="" disabled selected>-- Pilih Komoditas --</option>';

    if (!selectedSector || selectedSector === "" || selectedSector === "-- Pilih Sektor --" || document.getElementById("sektor").disabled) {
        select.disabled = true;
        addCommodityButton.disabled = true; 
        toggleTipeAvailability();
        return;
    }
    
    select.disabled = false;
    addCommodityButton.disabled = false;
    
    // 1. Dapatkan daftar komoditas dari data sistem
    let systemCommodities = SYSTEM_SECTOR_COMMODITY_MAP[selectedSector] || [];
    // 2. Ambil komoditas dari map kustom (dari API)
    const userCommodities = CUSTOM_COMMODITY_MAP[selectedSector] || []; 

    // 3. Gabungkan dan urutkan
    let uniqueCommodities = new Set([...userCommodities, ...systemCommodities]);
    let finalCommodities = Array.from(uniqueCommodities).filter(c => c.trim() !== "").sort(); 

    let foundSelected = false;

    // 4. Render options
    finalCommodities.forEach(commodity => {
        const option = document.createElement('option');
        option.value = commodity;
        option.textContent = commodity;
        if (commodity === currentValue) {
            option.selected = true;
            foundSelected = true;
        }
        select.appendChild(option);
    });
    
    // 5. Set nilai yang terpilih
    if (foundSelected) {
        select.value = currentValue;
    } else {
        select.value = "";
    }
    
    toggleTipeAvailability();
}


function updateKomoditasFilter() {
    renderKomoditasDropdown('');
}


// FUNGSI INI KINI MENGIRIM PERUBAHAN KE API
async function deleteCommodity(commodityName, selectedSector) { 
    if (SYSTEM_SECTOR_COMMODITY_MAP[selectedSector] && SYSTEM_SECTOR_COMMODITY_MAP[selectedSector].includes(commodityName)) {
        showPopup("Gagal Hapus", "Komoditas sistem tidak dapat dihapus.", [{ text: "OK", class: "popup-cancel" }]);
        return;
    }

    if (CUSTOM_COMMODITY_MAP[selectedSector]) {
        // 1. Hapus dari map kustom di memory
        CUSTOM_COMMODITY_MAP[selectedSector] = CUSTOM_COMMODITY_MAP[selectedSector].filter(c => c !== commodityName);
    }
    
    // 2. Kirim perubahan ke API
    const dataToSave = {
        customSectors: CUSTOM_SECTORS,
        customCommodityMap: CUSTOM_COMMODITY_MAP
    };
    
    const saveSuccess = await sendSectorData(dataToSave);
    
    if (saveSuccess) {
        // 3. Perbarui tampilan dropdown utama
        renderKomoditasDropdown('');
        
        // Perbarui tampilan bubbles di pop-up (jika pop-up masih terbuka)
        const bubblesContainer = document.getElementById("existingCommodityBubbles");
        if (bubblesContainer) {
            renderCommodityBubbles("existingCommodityBubbles");
        }
    }
}

function renderCommodityBubbles(containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    
    const selectedSector = document.getElementById("sektor").value;
    
    let systemCommodities = SYSTEM_SECTOR_COMMODITY_MAP[selectedSector] || [];
    const userCommodities = CUSTOM_COMMODITY_MAP[selectedSector] || []; 

    let uniqueCommodities = new Set([...userCommodities, ...systemCommodities]);
    let finalCommodities = Array.from(uniqueCommodities).filter(c => c.trim() !== "").sort(); 
    
    if (finalCommodities.length === 0) {
        container.innerHTML = `<p style="font-size: 11px; color: #999; text-align: center; margin: 10px 0;">Tidak ada komoditas. Coba tambah komoditas baru di bawah.</p>`;
        return;
    }

    finalCommodities.forEach(commodity => {
        const isSystemCommodity = systemCommodities.includes(commodity);
        
        const commodityDiv = document.createElement('div');
        commodityDiv.style.cssText = `
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            background: ${isSystemCommodity ? '#f0f4c3' : '#e0f2f1'}; 
            color: ${isSystemCommodity ? '#689f38' : '#00796b'}; 
            padding: 6px 10px;
            margin: 4px 0; 
            border-radius: 6px; 
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            width: 100%; 
            box-sizing: border-box;
            transition: background 0.2s;
        `;
        
        commodityDiv.onclick = () => {
            document.getElementById("komoditas").value = commodity; 
            toggleTipeAvailability(); 
            hidePopup();
        };
        
        const spanName = document.createElement('span');
        spanName.textContent = commodity + (isSystemCommodity ? ' (Sistem)' : '');
        spanName.style.flexGrow = '1';
        spanName.style.marginRight = isSystemCommodity ? '0' : '8px';
        
        commodityDiv.appendChild(spanName);

        if (!isSystemCommodity) {
            const deleteBtn = document.createElement('button');
            deleteBtn.textContent = 'x';
            deleteBtn.style.cssText = `
                background: #00796b; 
                border: none;
                color: white;
                font-size: 10px;
                margin-left: 8px; 
                padding: 1px 5px;
                cursor: pointer;
                opacity: 0.9; 
                font-weight: 700;
                border-radius: 50%;
                line-height: 1;
                height: 16px;
                width: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
            `;
            deleteBtn.onclick = (e) => {
                e.stopPropagation(); 
                showPopup("Konfirmasi Hapus", `Apakah anda yakin untuk menghapus komoditas "${commodity}" dari sektor ${selectedSector}?`, [
                    { text: "Batal", class: "popup-cancel", onClick: () => { /* no op */ } },
                    { text: "Hapus", class: "popup-confirm", onClick: () => { 
                        deleteCommodity(commodity, selectedSector); 
                        showPopup("Berhasil", `Komoditas "${commodity}" telah dihapus dan disinkronkan ke server.`, [{ text: "OK", class: "popup-ok" }]);
                    } }
                ]);
            };
            
            commodityDiv.appendChild(deleteBtn);
        }
        
        container.appendChild(commodityDiv);
    });
}


// FUNGSI INI KINI MENGIRIM PERUBAHAN KE API
async function saveNewCommodity(newCommodityName, selectedSector) { 
    const name = newCommodityName.trim();

    if (!name || name === "") {
        showPopup("Gagal", "Nama komoditas tidak boleh kosong.", [{ text: "OK", class: "popup-ok" }]);
        return;
    }
    
    const allSystemCommodities = SYSTEM_SECTOR_COMMODITY_MAP[selectedSector] || [];
    const allUserCommoditiesForSelectedSector = CUSTOM_COMMODITY_MAP[selectedSector] || [];
    
    const allRegisteredCommodities = new Set([...allSystemCommodities, ...allUserCommoditiesForSelectedSector]);

    if (Array.from(allRegisteredCommodities).map(c => c.toLowerCase()).includes(name.toLowerCase())) {
         showPopup("Perhatian", `Komoditas "${name}" sudah terdaftar pada sektor ini atau data sistem.`, [{ text: "OK", class: "popup-cancel" }]);
        return;
    }

    // 1. Simpan ke map kustom di memory
    if (!CUSTOM_COMMODITY_MAP[selectedSector]) {
        CUSTOM_COMMODITY_MAP[selectedSector] = [];
    }
    CUSTOM_COMMODITY_MAP[selectedSector].push(name);
    
    // 2. Kirim perubahan ke API
    const dataToSave = {
        customSectors: CUSTOM_SECTORS,
        customCommodityMap: CUSTOM_COMMODITY_MAP
    };

    const saveSuccess = await sendSectorData(dataToSave);

    if (saveSuccess) {
        // 3. Set komoditas baru sebagai nilai yang terpilih dan render ulang
        renderKomoditasDropdown(name); 
        
        showPopup("Berhasil", `Komoditas "${name}" berhasil ditambahkan ke sektor "${selectedSector}" dan disinkronkan ke server!`, [
            { text: "Tutup", class: "popup-ok" }
        ]);
        
        const bubblesContainer = document.getElementById("existingCommodityBubbles");
        if (bubblesContainer) {
            renderCommodityBubbles("existingCommodityBubbles");
        }
    } else {
        // Jika gagal simpan ke server, kembalikan state lokal
        CUSTOM_COMMODITY_MAP[selectedSector] = CUSTOM_COMMODITY_MAP[selectedSector].filter(c => c !== name);
    }
}
